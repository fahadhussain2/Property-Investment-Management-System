name: Keep-alive

# Supabase pauses free projects after 7 days without activity. One tiny API query a day prevents it.
# (GitHub itself disables scheduled workflows after 60 days without commits: re-enable them in the Actions tab.)
on:
  schedule:
    - cron: '0 4 * * *' # 09:00 in Pakistan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Query the database through the API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        # public.ping() (go-live migration): runs a query, returns only the time.
        run: |
          curl -fsS --retry 3 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d "{}"
