name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # One job so the local Supabase stack starts only once (saves free CI minutes).
  database-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      # storage-api stays on: documents (spec 004) are uploaded to Supabase Storage in the tests and e2e.
      - run: npx supabase start -x edge-runtime,logflare,vector,imgproxy,supavisor,realtime,studio
      - name: pgTAP tests
        run: npx supabase test db
      - name: Acceptance evals
        run: npm run evals
      - name: Generated DB types are up to date
        run: npm run db:types:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: End-to-end tests
        run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
